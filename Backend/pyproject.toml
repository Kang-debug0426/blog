[project]
name = "imcjk-backend"
version = "0.1.0"
description = "IMCJK 网站重构 — 新后端（FastAPI），对旧系统做行为等价的 Legacy Compatibility 复刻"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# 依赖说明（全部对应冻结决策，不引入额外组件）
#   fastapi            ← ADR-001（后端框架）
#   sqlalchemy[asyncio]← ADR-002（异步 ORM + Alembic）
#   pydantic / -settings← ADR-001（@Valid → Pydantic v2）、ADR-006（密钥走环境变量）
#   aiomysql           ← ADR-002：驱动“具体在 Phase 2 定版” → 本轮定为 aiomysql
#                         （纯 Python，依赖 PyMySQL；备选 asyncmy 需编译，见最终报告）
#   redis              ← ADR-005（保留全部 Redis 机制）
#   PyJWT              ← ADR-005 / §JWT 兼容层（算法来自配置，不写死）
#   argon2-cffi        ← ADR-009（新密码存储 = Argon2id）
#   python-multipart   ← /admin/common/upload（multipart/form-data）
# ---------------------------------------------------------------------------
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiomysql>=0.2.0",
  "PyMySQL>=1.1",
  "redis>=5.0",
  "PyJWT>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 ``import app.*`` 在 backend/ 目录下可直接解析（无需安装包）
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "contract: 契约测试（不需要数据库/Redis/OSS）",
  "integration: 需要本地隔离环境的测试（默认跳过）",
  "legacy: 记录旧系统已知缺陷行为的测试",
  "e2e: 真实浏览器端到端测试（需本机 Chrome + playwright；浏览器不可用 ⇒ BLOCKED 而非 skip）",
]
filterwarnings = ["ignore::DeprecationWarning"]
